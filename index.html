    <script>
      (function() {
        // Intercept and cleanly handle harmless Vite HMR WebSocket reconnection logs in containerized sandbox
        // If showAllErrors flag is enabled in localStorage, suppression is bypassed for strict diagnostic routing
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var rawFeatures = localStorage.getItem('dataanalytix_features');
            if (rawFeatures && JSON.parse(rawFeatures).showAllErrors === true) {
              return; // Strict mode: do not suppress
            }
          } catch(e) {}
          var msg = (event && event.reason && (event.reason.message || event.reason.stack || String(event.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          try {
            var rawFeatures = localStorage.getItem('dataanalytix_features');
            if (rawFeatures && JSON.parse(rawFeatures).showAllErrors === true) {
              return; // Strict mode: do not suppress
            }
          } catch(e) {}
          var msg = (event && (event.message || String(event))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Apply saved theme (Dark / Light / System) and unifiedTheme attribute before first paint
        try {
          var pref = localStorage.getItem('dataanalytix_theme_pref') || localStorage.getItem('acuitybi_theme') || 'dark';
          var resolved = pref === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : (pref === 'light' ? 'light' : 'dark');
          var root = document.documentElement;
          root.style.colorScheme = resolved;
          if (resolved === 'light') {
            root.classList.add('theme-light');
            root.classList.remove('dark', 'theme-dark');
          } else {
            root.classList.add('dark', 'theme-dark');
            root.classList.remove('theme-light');
          }
          var rawFlags = localStorage.getItem('dataanalytix_features');
          if (rawFlags && JSON.parse(rawFlags).unifiedTheme === true) {
            root.setAttribute('data-unified-theme', 'true');
          }
        } catch (e) {}
      })();
    </script>
