name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        run: bun x tsc --noEmit

      - name: Run unit test suite
        run: npm test

      - name: Run semantic color token audit
        run: node scripts/check-colors.mjs

      - name: Build production bundle (tsc --noEmit && vite build)
        run: npm run build

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Run Required Playwright E2E Suites (phase3-ui-cleanup, analytics-packs, qa, theme-contrast, sidebar-smoke)
        run: npx playwright test e2e/phase3-ui-cleanup.spec.ts e2e/analytics-packs.spec.ts e2e/qa.spec.ts e2e/theme-contrast.spec.ts e2e/sidebar-smoke.spec.ts


